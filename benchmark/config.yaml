model:
  backend: codex_exec
  optimizer: gpt-6-sol
  target: gpt-6-luna
  optimizer_backend: codex_exec
  target_backend: codex_exec
  reasoning_effort: low
  codex_exec_sandbox: read-only
  codex_exec_use_sdk: cli
  codex_exec_network_access: false
  codex_exec_web_search: false
  codex_exec_approval_policy: never
  codex_trace_to_optimizer: false
train:
  num_epochs: 1
  train_size: 0
  batch_size: 9
  accumulation: 1
  seed: 42
gradient:
  minibatch_size: 3
  merge_batch_size: 3
  analyst_workers: 1
  failure_only: true
optimizer:
  learning_rate: 2
  min_learning_rate: 2
  lr_scheduler: constant
  use_slow_update: false
  use_meta_skill: false
evaluation:
  use_gate: true
  sel_env_num: 0
  test_env_num: 0
  eval_test: true
env:
  name: literature_access
  split_mode: split_dir
  split_dir: benchmark/data
  exec_timeout: 180
  workers: 1
  limit: 0
